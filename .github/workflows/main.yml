name: Push
on:
  push:
    branches:
      - main
      - 'xurei/**'
    tags:
      - '*'
permissions:
  contents: write

jobs:
  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-custom-mod.yml
    secrets: inherit
    permissions:
      contents: read

  package-modpack:
    name: Package Modpack 📦
    runs-on: ubuntu-26.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v8
        id: download

      - name: "Install custom mods in modpack"
        id: install-mods
        run: |
          cd phone-artifacts
          ls -la
          cd ..
          cp phone-artifacts/minedevice-fabric-1.1.3-pre.jar packwiz/modpack/mods
          cp corruption-artifacts/corruption-1.0.0.jar packwiz/modpack/mods

      - name: "📦 Build with packwiz"
        id: package
        run: |
          cd packwiz/modpack
          ../packwiz modrinth export

      - name: "📡 Upload Modpack"
        uses: actions/upload-artifact@v7
        with:
          name: Cattaga-S2-modrinth
          path: ${{ github.workspace }}/packwiz/modpack/*.mrpack

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    needs: package-modpack
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        with:
          name: Cattaga-S2-modrinth

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@v2.6.2
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: Cattaga-s2-${{ steps.check.outputs.version }}
          files: |
            ${{ github.workspace }}/*.mrpack
